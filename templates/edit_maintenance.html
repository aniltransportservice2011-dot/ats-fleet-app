{% extends "base.html" %}
{% block title %}Edit Maintenance{% endblock %}
{% block content %}
<div class="wrap" style="max-width:700px;">
  <a class="back" href="/maintenance">&larr; Back</a>
  <h1>Edit Maintenance</h1>
  <form class="stack" method="POST">
    <div class="row2">
      <div><label>Date</label><input type="date" name="date" value="{{ m['date'] }}" required></div>
      <div><label>Vehicle No</label><input type="text" name="vehicle_no" value="{{ m['vehicle_no'] or '' }}" list="vehicle-list" required></div>
    </div>
    <div class="row2">
      <div><label>Category</label><input type="text" name="category" value="{{ m['category'] or '' }}"></div>
      <div><label>Amount</label><input type="number" step="0.01" name="amount" value="{{ m['amount'] or 0 }}" required></div>
    </div>
    <div class="row2">
      <div><label>Paid Amount</label><input type="number" step="0.01" name="paid_amount" value="{{ m['paid_amount'] or 0 }}"></div>
      <div><label>Vendor Name</label><input type="text" name="vendor_name" value="{{ m['vendor_name'] or '' }}" list="combined-list"></div>
    </div>
    <div><label>Notes</label><input type="text" name="notes" value="{{ m['notes'] or '' }}"></div>
    <button type="submit" class="submit">Save Changes</button>
    <datalist id="vehicle-list">
      {% for v in vehicles %}<option value="{{ v['vehicle_no'] }}">{% endfor %}
    </datalist>
    <datalist id="combined-list">
      {% for n in combined_names %}<option value="{{ n }}">{% endfor %}
    </datalist>
  </form>
</div>
{% endblock %}
