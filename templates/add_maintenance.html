{% extends "base.html" %}
{% block title %}Add Maintenance{% endblock %}
{% block content %}
<div class="wrap" style="max-width:700px;">
  <a class="back" href="/maintenance">&larr; Back</a>
  <h1>Add Maintenance</h1>
  <form class="stack" method="POST">
    <div class="row2">
      <div><label>Date</label><input type="date" name="date" required></div>
      <div><label>Vehicle No</label><input type="text" name="vehicle_no" list="vehicle-list" required></div>
    </div>
    <div class="row2">
      <div><label>Category</label><input type="text" name="category" placeholder="e.g. Repair Parts, Service"></div>
      <div><label>Amount</label><input type="number" step="0.01" name="amount" id="amAmount" required oninput="mtSyncPaid('amVendor','amAmount','amPaid','amPaidReq')"></div>
    </div>
    <div class="row2">
      <div><label>Paid Amount <span id="amPaidReq" style="color:var(--red);"></span></label><input type="number" step="0.01" name="paid_amount" id="amPaid" placeholder="0 if unpaid so far"></div>
      <div><label>Vendor Name</label><input type="text" name="vendor_name" id="amVendor" list="combined-list" oninput="mtSyncPaid('amVendor','amAmount','amPaid','amPaidReq')" onblur="mtSyncPaid('amVendor','amAmount','amPaid','amPaidReq')"></div>
    </div>
    <div><label>Notes</label><input type="text" name="notes"></div>
    <button type="submit" class="submit">Save Maintenance Entry</button>
    <datalist id="vehicle-list">
      {% for v in vehicles %}<option value="{{ v['vehicle_no'] }}">{% endfor %}
    </datalist>
    <datalist id="combined-list">
      {% for n in combined_names %}<option value="{{ n }}">{% endfor %}
    </datalist>
  </form>
</div>
<script>
// See partials/_maintenance_insurance_modals.html for the full explanation.
function mtSyncPaid(vendorId, amtId, paidId, reqId) {
  var vendor = document.getElementById(vendorId);
  var amt = document.getElementById(amtId);
  var paid = document.getElementById(paidId);
  if (!vendor || !amt || !paid) return;
  var hasVendor = vendor.value.trim().length > 0;
  var req = reqId ? document.getElementById(reqId) : null;
  paid.required = hasVendor;
  if (req) req.textContent = hasVendor ? '*' : '';
  if (hasVendor) {
    paid.readOnly = false;
    paid.style.background = '';
  } else {
    paid.value = amt.value || 0;
    paid.readOnly = true;
    paid.style.background = 'var(--paper)';
  }
}
// Fallback for browser extensions (autofill/form-fill helpers) that set a field's .value
// directly via JS -- that never fires input/change/even blur in some cases, so oninput/onblur
// alone can silently miss a real vendor selection. This just polls the actual value on a timer,
// completely independent of whatever events do or don't fire, so it catches it regardless.
function mtWatchVendor(vendorId, amtId, paidId, reqId) {
  var vendor = document.getElementById(vendorId);
  if (!vendor) return;
  var last = vendor.value;
  setInterval(function() {
    if (vendor.value !== last) {
      last = vendor.value;
      mtSyncPaid(vendorId, amtId, paidId, reqId);
    }
  }, 400);
}
// Set the correct initial locked/unlocked state on page load, not just once the user starts
// typing -- otherwise Paid Amount looks editable even with no vendor selected yet.
mtSyncPaid('amVendor', 'amAmount', 'amPaid', 'amPaidReq');
mtWatchVendor('amVendor', 'amAmount', 'amPaid', 'amPaidReq');
</script>
{% endblock %}
