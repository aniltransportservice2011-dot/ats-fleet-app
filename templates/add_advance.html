{% extends "base.html" %}
{% block title %}Add Advance{% endblock %}
{% block extra_head %}
<style>

</style>
{% endblock %}
{% block content %}
<div class="wrap">
  <a class="back" href="/advances">&larr; Back</a>
  
  <h1>Add Advance Entry</h1>
  <form class="stack" method="POST">
    <div><label>Employee</label><input type="text" name="employee" required></div>
    <div><label>Date</label><input type="date" name="date" required></div>
    <div><label>Amount</label><input type="number" step="0.01" name="amount" required></div>
    <div><label>Type</label>
      <select name="type">
        <option value="given">Given (emergency/advance to employee)</option>
        <option value="repaid">Repaid (employee paying back)</option>
      </select>
    </div>
    <div><label>Notes</label><input type="text" name="notes" placeholder="Reason, e.g. medical emergency"></div>
    <button type="submit" class="submit">Save</button>
  </form>
</div>
{% endblock %}
