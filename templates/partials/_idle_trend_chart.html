<svg viewBox="0 0 700 220" width="100%" style="overflow:visible;max-height:260px;">
  {% for tick in y_ticks %}
  <line x1="30" y1="{{ tick.y }}" x2="680" y2="{{ tick.y }}" stroke="#e2e6ed" stroke-width="1"/>
  <text x="24" y="{{ tick.y + 4 }}" font-size="10" text-anchor="end" fill="#5A6B8C">{{ tick.value }}</text>
  {% endfor %}

  <polygon points="{{ trend[0].x }},{{ chart_bottom }} {% for t in trend %}{{ t.x }},{{ t.y }} {% endfor %}{{ trend[-1].x }},{{ chart_bottom }}"
           fill="#e34948" opacity="0.12"/>
  <polyline points="{% for t in trend %}{{ t.x }},{{ t.y }} {% endfor %}" fill="none" stroke="#e34948" stroke-width="2.5"/>

  {% for t in trend %}
  <circle cx="{{ t.x }}" cy="{{ t.y }}" r="3.5" fill="#e34948"/>
  <text x="{{ t.x }}" y="{{ t.y - 10 }}" font-size="10.5" text-anchor="middle" fill="#14213d" font-weight="600">{{ t.idle_days }}</text>
  <text x="{{ t.x }}" y="208" font-size="10" text-anchor="middle" fill="#5A6B8C">{{ t.label }}</text>
  {% endfor %}
</svg>
