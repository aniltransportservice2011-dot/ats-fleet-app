<div class="modal-overlay" id="addUreaModal">
  <div class="modal-box mt-modal-box">
    <button type="button" class="modal-close-x" onclick="document.getElementById('addUreaModal').classList.remove('open')">&#10005;</button>
    <h3 id="ureaModalTitle">&#128167; Add Urea</h3>

    <div class="bat-mode-tabs">
      <div class="bat-mode-tab" id="ureaTabDirect" onclick="ureaSetMode('direct')">
        <div class="ic">&#9889;</div>
        <div><div class="lbl">Add New</div><div class="sub">Buy &amp; use right now, off-stock</div></div>
      </div>
      <div class="bat-mode-tab" id="ureaTabStockIn" onclick="ureaSetMode('stock_in')">
        <div class="ic">&#128230;</div>
        <div><div class="lbl">Add to Stock</div><div class="sub">Bulk purchase into inventory</div></div>
      </div>
      <div class="bat-mode-tab" id="ureaTabStockOut" onclick="ureaSetMode('stock_out')">
        <div class="ic">&#128666;</div>
        <div><div class="lbl">Used from Stock</div><div class="sub">Refill a vehicle from stock</div></div>
      </div>
    </div>

    <form method="POST" id="ureaForm" action="/maintenance/urea/add">
      <input type="hidden" name="mode" id="ureaModeField" value="direct">

      <div class="mt-form-grid">
        <div class="mt-fld"><label>Date *</label><input type="date" id="ureaDate" name="date" required></div>
        <div class="mt-fld" id="ureaLocationWrap"><label>Location</label><input type="text" id="ureaLocation" name="location" list="urea-location-list" placeholder="e.g. Rourkela Depot"></div>
      </div>

      <!-- DIRECT (Add New) fields -->
      <div id="ureaDirectFields">
        <div class="mt-form-grid">
          <div class="mt-fld"><label>Vehicle No *</label><input type="text" id="ureaDVehicle" name="vehicle_no" list="vehicle-list"></div>
          <div class="mt-fld"><label>Quantity (L) *</label><input type="number" step="0.01" id="ureaDQty" name="quantity_l"></div>
          <div class="mt-fld"><label>Unit Price (₹) *</label><input type="number" step="0.01" id="ureaDPrice" name="unit_price"></div>
          <div class="mt-fld"><label>Odometer (km)</label><input type="number" step="1" id="ureaDOdo" name="odometer_km"></div>
        </div>
        <div class="mt-form-grid">
          <div class="mt-fld"><label>Supplier</label><input type="text" id="ureaDSupplier" name="supplier_name" list="combined-list" placeholder="Where it was bought"></div>
          <div class="mt-fld"><label>Invoice No.</label><input type="text" id="ureaDInvoice" name="invoice_no"></div>
          <div class="mt-fld"><label>Paid Amount (₹)</label><input type="number" step="0.01" id="ureaDPaid" name="paid_amount"></div>
        </div>
      </div>

      <!-- STOCK IN (Add to Stock) fields -->
      <div id="ureaStockInFields" style="display:none;">
        <div class="mt-form-grid">
          <div class="mt-fld"><label>Supplier *</label><input type="text" id="ureaSISupplier" name="supplier_name" list="combined-list"></div>
          <div class="mt-fld"><label>Invoice No. / Reference *</label><input type="text" id="ureaSIInvoice" name="invoice_no"></div>
          <div class="mt-fld"><label>Batch No. *</label><input type="text" id="ureaSIBatch" name="batch_no" placeholder="e.g. UREA-050825-01"></div>
          <div class="mt-fld"><label>Quantity (L) *</label><input type="number" step="0.01" id="ureaSIQty" name="quantity_l"></div>
        </div>
        <div class="mt-form-grid">
          <div class="mt-fld"><label>Unit Price (₹) *</label><input type="number" step="0.01" id="ureaSIPrice" name="unit_price"></div>
          <div class="mt-fld"><label>Paid Amount (₹)</label><input type="number" step="0.01" id="ureaSIPaid" name="paid_amount"></div>
        </div>
      </div>

      <!-- STOCK OUT (Used from Stock) fields -->
      <div id="ureaStockOutFields" style="display:none;">
        <div class="mt-form-grid">
          <div class="mt-fld"><label>Vehicle No *</label><input type="text" id="ureaSOVehicle" name="vehicle_no" list="vehicle-list"></div>
          <div class="mt-fld"><label>Batch No.</label><input type="text" id="ureaSOBatch" name="batch_no"></div>
          <div class="mt-fld"><label>Quantity (L) *</label><input type="number" step="0.01" id="ureaSOQty" name="quantity_l"></div>
          <div class="mt-fld"><label>Unit Price (₹)</label><input type="number" step="0.01" id="ureaSOPrice" name="unit_price"></div>
        </div>
        <div class="mt-form-grid">
          <div class="mt-fld"><label>Odometer (km)</label><input type="number" step="1" id="ureaSOOdo" name="odometer_km"></div>
        </div>
      </div>

      <div class="mt-fld"><label>Notes (Optional)</label><textarea id="ureaNotes" name="notes" rows="2"></textarea></div>

      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px;">
        <button type="button" onclick="document.getElementById('addUreaModal').classList.remove('open')" class="btn-cancel">Cancel</button>
        <button type="submit" class="add-btn" id="ureaSubmitBtn" style="background:var(--accent);border:none;cursor:pointer;">Save Entry</button>
      </div>
    </form>
  </div>
</div>

<datalist id="urea-location-list">{% for loc in locations %}<option value="{{ loc }}">{% endfor %}</datalist>

<script>
function ureaSetMode(mode) {
  document.getElementById('ureaModeField').value = mode;
  ['ureaTabDirect','ureaTabStockIn','ureaTabStockOut'].forEach(function(id){ document.getElementById(id).classList.remove('active'); });
  document.getElementById('ureaDirectFields').style.display = mode === 'direct' ? '' : 'none';
  document.getElementById('ureaStockInFields').style.display = mode === 'stock_in' ? '' : 'none';
  document.getElementById('ureaStockOutFields').style.display = mode === 'stock_out' ? '' : 'none';

  // Disable every field in inactive sections so only the active mode's data is submitted —
  // and unify all 3 modes' fields onto the same POST field names (quantity_l/unit_price/etc.)
  // via explicit id lookups, never a name-based selector that could match the wrong element.
  var sections = {direct: 'ureaDirectFields', stock_in: 'ureaStockInFields', stock_out: 'ureaStockOutFields'};
  Object.keys(sections).forEach(function(key) {
    var wrap = document.getElementById(sections[key]);
    wrap.querySelectorAll('input, select, textarea').forEach(function(el) { el.disabled = (key !== mode); });
  });

  var titles = {direct: '&#9889; Add New Urea Entry', stock_in: '&#128230; Add Urea to Stock', stock_out: '&#128666; Use Urea from Stock'};
  document.getElementById('ureaModalTitle').innerHTML = titles[mode];
  var tabIds = {direct: 'ureaTabDirect', stock_in: 'ureaTabStockIn', stock_out: 'ureaTabStockOut'};
  document.getElementById(tabIds[mode]).classList.add('active');
}
document.addEventListener('DOMContentLoaded', function(){ ureaSetMode('direct'); });
</script>
