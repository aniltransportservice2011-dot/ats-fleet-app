<svg viewBox="0 0 700 220" width="100%" style="overflow:visible;max-height:260px;">
  {% for tick in y_ticks %}
  <line x1="34" y1="{{ tick.y }}" x2="680" y2="{{ tick.y }}" stroke="#e2e6ed" stroke-width="1"/>
  <text x="28" y="{{ tick.y + 4 }}" font-size="10" text-anchor="end" fill="#5A6B8C">{{ tick.value }}</text>
  {% endfor %}

  {% if trend %}
  <polygon points="{{ trend[0].x }},{{ chart_bottom }} {% for m in trend %}{{ m.x }},{{ m.y }} {% endfor %}{{ trend[-1].x }},{{ chart_bottom }}"
           fill="{{ line_color }}" opacity="0.12"/>
  <polyline points="{% for m in trend %}{{ m.x }},{{ m.y }} {% endfor %}" fill="none" stroke="{{ line_color }}" stroke-width="2.5"/>

  {% for m in trend %}
  <circle cx="{{ m.x }}" cy="{{ m.y }}" r="3.5" fill="{{ line_color }}"/>
  <text x="{{ m.x }}" y="{{ m.y - 10 }}" font-size="10.5" text-anchor="middle" fill="#14213d" font-weight="600">{{ m.trips }}</text>
  <text x="{{ m.x }}" y="208" font-size="10" text-anchor="middle" fill="#5A6B8C">{{ m.label }}</text>
  {% endfor %}
  {% else %}
  <text x="350" y="110" font-size="12" text-anchor="middle" fill="#5A6B8C">No trip data for this selection.</text>
  {% endif %}
</svg>
