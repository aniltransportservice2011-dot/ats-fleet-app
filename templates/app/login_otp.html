<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- This page doesn't extend base_app.html (it's the pre-login entry point), so it needs its own
     copy of the same zoom lock — see base_app.html's viewport meta for the full rationale. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Login with Mobile — {{ company_name }}</title>
<link rel="manifest" href="{{ url_for('static', filename='app-manifest.json') }}">
<meta name="theme-color" content="#0D1B2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='app-icons/icon-180.png') }}">
<link rel="icon" href="{{ url_for('static', filename='app-icons/icon-192.png') }}">
<link rel="stylesheet" href="{{ asset_v('app.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='app-auth.css') }}">

<!-- Same photo-hero + white-card frame as login.html/signup.html (42/58 split, fluid spacing
     unit, locked non-scrolling viewport) — this file's own <style> below loads after
     app-auth.css so it can override that file's older centered-card layout for THIS page only,
     while login_otp.html/verify_otp.html keep reusing app-auth.css's actual form components
     (.au-phone-input, .au-otp-box, etc.) untouched. -->
<style>
  :root {
    --lg-extra: clamp(0px, calc((100dvh - 640px) * 0.049), 10px);
  }
  body.app-login-body {
    display: flex !important; flex-direction: column !important; align-items: stretch !important; justify-content: flex-start !important;
    height: 100vh; height: 100dvh; min-height: 0 !important; overflow: hidden; padding: 0 !important;
    background: var(--a-white);
  }
  .lg-hero {
    position: relative; flex: 0 0 auto; height: 42dvh; min-height: 200px;
    background-image: url("{{ url_for('static', filename='img/login-hero.jpg') }}");
    background-size: cover; background-position: center 58%; background-repeat: no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 24px 0;
  }
  .lg-hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,22,41,0.5) 0%, rgba(8,22,41,0.14) 32%, rgba(8,22,41,0) 55%); }
  .lg-hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(180deg, rgba(10,14,22,0) 0%, rgba(10,14,22,0.4) 100%); }
  .lg-badge { position: relative; z-index: 2; width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--a-accent), var(--a-accent-dark)); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(249,115,22,0.35); }
  .lg-brand { position: relative; z-index: 2; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.05rem;
    color: #fff; text-align: center; margin: 9px 0 2px; text-shadow: 0 2px 10px rgba(9,26,49,0.5); }
  .lg-tagline { position: relative; z-index: 2; font-style: italic; font-size: 0.76rem; font-weight: 400;
    color: rgba(255,255,255,0.88); text-align: center; text-shadow: 0 1px 6px rgba(9,26,49,0.45); }

  .lg-card { position: relative; z-index: 2; flex: 1 1 0; min-height: 0; overflow-y: auto;
    margin-top: -20px; background: var(--a-white); border-radius: 20px 20px 0 0;
    padding: calc(8px + var(--lg-extra)) 24px max(calc(8px + var(--lg-extra)), env(safe-area-inset-bottom));
    box-shadow: 0 -14px 30px -18px rgba(11,42,78,0.25); }
  .lg-card .au-subhead { margin-bottom: calc(6px + var(--lg-extra)); }
  .lg-card .au-card { box-shadow: none; padding: 0; }
  .lg-card .au-info-box { margin-top: calc(10px + var(--lg-extra)); }
  /* The form components below (.au-phone-input, .au-btn-primary, etc.) already use a reasonably
     tall 12px vertical padding from app-auth.css — kept as-is; only the page frame around them
     changed here. */
</style>
</head>
<body class="app-login-body">

<div class="lg-hero">
  <div class="lg-badge">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16v2a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2Z"/><circle cx="7.5" cy="16" r="1.4" fill="#fff" stroke="none"/><circle cx="16.5" cy="16" r="1.4" fill="#fff" stroke="none"/></svg>
  </div>
  <p class="lg-brand">ATS Fleet Management</p>
  <p class="lg-tagline">Drive Business. Move India.</p>
</div>

<div class="lg-card">
  <div class="au-subhead">
    <a href="{{ url_for('app_login') }}" class="au-back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div>
      <div class="au-subhead-title">Login with Mobile</div>
      <div class="au-subhead-sub">Enter your mobile number to continue</div>
    </div>
  </div>

  <div class="au-card">
    {% if error %}<div class="au-error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('app_login_otp') }}">
      <div class="au-field">
        <label for="phone">Mobile Number</label>
        <div class="au-phone-input">
          <span class="au-phone-prefix">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            +91
          </span>
          <input type="tel" id="phone" name="phone" inputmode="numeric" placeholder="Enter mobile number" maxlength="10" pattern="[0-9]{10}" required>
        </div>
      </div>
      <button type="submit" class="au-btn-primary">Send OTP</button>
    </form>

    <div class="au-divider"><span>OR</span></div>

    <a href="{{ url_for('app_login') }}" class="au-link" style="display:block; text-align:center; font-size:0.88rem; font-weight:700;">Login with Username</a>
  </div>

  <div class="au-info-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
    <div>
      <div class="t">Secure &amp; Safe</div>
      <div class="d">We never share your number with anyone.</div>
    </div>
  </div>
</div>
</body>
</html>
