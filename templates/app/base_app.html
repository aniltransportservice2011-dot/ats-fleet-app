<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Anil Transport{% endblock %}</title>

<!-- Installable app manifest — scoped to /app/ only. The website's own pages (base.html) never
     link this, so only this section ever offers "Add to Home Screen" / "Install app", and only
     this section is what launches full-screen with no browser chrome once installed. -->
<link rel="manifest" href="{{ url_for('static', filename='app-manifest.json') }}">
<meta name="theme-color" content="#c05621">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Anil Transport">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='app-icons/icon-180.png') }}">
<link rel="icon" href="{{ url_for('static', filename='app-icons/icon-192.png') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
{% block extra_head %}{% endblock %}
</head>
<body class="app-body">

<header class="a-topbar">
  <div class="a-topbar-left">
    <span class="a-brand-badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h11v8H2z"/><path d="M13 11h4l3 3v2h-7z"/><circle cx="6" cy="17.6" r="1.4" fill="#fff" stroke="none"/><circle cx="16.5" cy="17.6" r="1.4" fill="#fff" stroke="none"/></svg>
    </span>
    <span class="a-brand-name">{{ company_name }}</span>
  </div>
  <div class="a-topbar-right">
    <a href="/app/notifications" class="a-bell">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      {% if notif_count %}<span class="a-badge">{{ notif_count }}</span>{% endif %}
    </a>
    <div class="a-avatar">{{ user_initials }}</div>
  </div>
</header>

<main class="a-wrap">
  {% block content %}{% endblock %}
</main>

<nav class="a-bottom-nav">
  <a href="/app/dashboard" class="a-bn-item {% if active=='dashboard' %}active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>
    Home
  </a>
  <a href="/app/trips" class="a-bn-item {% if active=='trips' %}active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="10" r="2.4"/></svg>
    Trips
  </a>
  <div class="a-bn-fab-wrap">
    <button type="button" class="a-bn-fab" id="fabToggle" onclick="toggleFabMenu()" aria-label="Quick add" aria-expanded="false">
      <svg id="fabIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="fab-menu" id="fabMenu">
      <a href="/app/trips/add" class="fab-option" data-pos="1">
        <span class="fab-option-ic" style="background:#fdecea;color:var(--a-red);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16v2a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2Z"/></svg></span>
        <span class="fab-option-label">Add Trip</span>
      </a>
      <a href="/maintenance/add" class="fab-option" data-pos="2">
        <span class="fab-option-ic" style="background:#eaf1fb;color:var(--a-blue);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg></span>
        <span class="fab-option-label">Add Maintenance</span>
      </a>
      <a href="/overheads/add" class="fab-option" data-pos="3">
        <span class="fab-option-ic" style="background:#efeaff;color:var(--a-purple);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-1"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></svg></span>
        <span class="fab-option-label">Add Expense</span>
      </a>
      <a href="/vehicles/add" class="fab-option" data-pos="4">
        <span class="fab-option-ic" style="background:#e8f5ee;color:var(--a-green);"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16v2a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2Z"/><circle cx="7.5" cy="16" r="1.3"/><circle cx="16.5" cy="16" r="1.3"/></svg></span>
        <span class="fab-option-label">Add Vehicle</span>
      </a>
    </div>
  </div>
  <div class="fab-backdrop" id="fabBackdrop" onclick="closeFabMenu()"></div>
  <a href="/app/maintenance" class="a-bn-item {% if active=='maintenance' %}active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    Maintenance
  </a>
  <a href="/app/more" class="a-bn-item {% if active=='more' %}active{% endif %}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    More
  </a>
</nav>

<script>
  // Registered with an explicit scope of /app/ — this service worker can only ever control pages
  // under /app/, never the website's own pages, even though it's served from the shared /static/.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register("{{ url_for('static', filename='app-sw.js') }}", { scope: '/app/' })
        .catch(function (err) { console.warn('Service worker registration failed:', err); });
    });
  }

  // FAB speed-dial — tapping + fans out 4 real quick-add links (each routes to an existing,
  // working page: /app/trips/add, /maintenance/add, /overheads/add, /vehicles/add) instead of
  // jumping straight to Add Trip. Lives here (base_app.html), not a per-page script, since the
  // FAB itself is shared chrome on every /app/ page.
  function openFabMenu() {
    document.getElementById('fabMenu').classList.add('open');
    document.getElementById('fabBackdrop').classList.add('open');
    document.getElementById('fabToggle').classList.add('open');
    document.getElementById('fabToggle').setAttribute('aria-expanded', 'true');
  }
  function closeFabMenu() {
    document.getElementById('fabMenu').classList.remove('open');
    document.getElementById('fabBackdrop').classList.remove('open');
    document.getElementById('fabToggle').classList.remove('open');
    document.getElementById('fabToggle').setAttribute('aria-expanded', 'false');
  }
  function toggleFabMenu() {
    if (document.getElementById('fabMenu').classList.contains('open')) closeFabMenu();
    else openFabMenu();
  }
</script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
