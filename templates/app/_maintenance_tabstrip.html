<!-- Shared Maintenance tab strip — 4 real tabs shown as boxes (Overview/Service/Tyres/Battery) +
     a "More" box for the 3 remaining real tabs (Urea, Toll, Compliance), same 7 real tabs as
     templates/maintenance.html's own tab_titles (see MAINTENANCE_TAB_LABELS / maintenance_list()
     in app.py — no fabricated tabs like Fuel/Documents/Drivers/Reports/Settings). Overview and
     Service are native sub-tabs of /app/maintenance itself; Tyres, Battery, Urea and Toll are
     their own native top-level pages (app_tyres()/app_battery()/app_urea()/app_toll()), not
     ?tab= query params — landing on any one of those must not lose the way back to the others,
     so EVERY page that's one of these 7 tabs includes this exact same partial instead of each
     repeating the markup inline. That inline-copy version is exactly what drifted out of sync
     before this was extracted here: maintenance.html got its own tab count trimmed from 6 to 4
     (Urea moved into More) in one pass, but tyres.html/battery.html/urea.html/toll.html/
     compliance.html each had their own separate copy of the OLD 6-tab strip that never got
     touched — so landing on Tyres (or any of the others) from Maintenance, or from anywhere else,
     went "back" to the stale wider layout. One shared partial means that class of drift can't
     happen again — same reasoning _overview_tabstrip.html's own comment already gives for why
     that one exists.

     Needs `mo_active` from the including template (one of: 'overview', 'service', 'tyres',
     'battery', 'urea', 'toll', 'compliance') — deliberately not reusing the app-wide `active`
     variable, which every /app/ page already passes for the bottom nav's own Home/Trips/Ledger/
     More highlighting; this is a different, page-local "which of the 7 tabs" concept. -->
<div class="mo-tabstrip">
  <a class="mo-tab {{ 'active' if mo_active == 'overview' }}" href="{{ url_for('app_maintenance') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg>
    <span>Overview</span></a>
  <a class="mo-tab {{ 'active' if mo_active == 'service' }}" href="{{ url_for('app_maintenance', tab='service') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
    <span>Service</span></a>
  <a class="mo-tab {{ 'active' if mo_active == 'tyres' }}" href="{{ url_for('app_tyres') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3.2"/></svg>
    <span>Tyres</span></a>
  <a class="mo-tab {{ 'active' if mo_active == 'battery' }}" href="{{ url_for('app_battery') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="12" rx="2"/><path d="M7 7V5h2v2M15 7V5h2v2M7 13h4"/></svg>
    <span>Battery</span></a>
  <button type="button" class="mo-tab {{ 'active' if mo_active in ('urea', 'toll', 'compliance') }}" id="moMoreTabBtn" onclick="toggleMoMoreSheet()" aria-expanded="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    <span>More</span></button>
</div>

<!-- More sheet — Urea, Toll (both native, their own real pages) and Compliance (still bridges to
     the website), the 3 real tabs that don't fit the row above. Bottom sheet (slides up) rather
     than the bottom-nav's own diagonal speed-dial, since this is a page-local grid of tab
     destinations, not app-wide quick links. -->
<div class="mo-more-backdrop" id="moMoreBackdrop" onclick="closeMoMoreSheet()"></div>
<div class="mo-more-sheet" id="moMoreSheet">
  <div class="mo-more-handle"></div>
  <div class="mo-more-title">All Tabs</div>
  <div class="mo-more-grid">
    <a href="{{ url_for('app_urea') }}" class="mo-more-item">
      <span class="mo-more-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v6M8 8h8l2 12a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L8 8Z"/></svg></span>
      <span>Urea</span>
    </a>
    <a href="{{ url_for('app_toll') }}" class="mo-more-item">
      <span class="mo-more-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 20V6a2 2 0 0 1 2-2h6l8 8-8 8H6a2 2 0 0 1-2-2Z"/><circle cx="9" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></span>
      <span>Toll</span>
    </a>
    <a href="{{ url_for('app_compliance') }}" class="mo-more-item">
      <span class="mo-more-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3Z"/></svg></span>
      <span>Compliance</span>
    </a>
  </div>
</div>
