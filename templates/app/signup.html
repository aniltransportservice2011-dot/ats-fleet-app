<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Same locked, non-scrolling standalone shell as login.html — see that file's head comments
     for the full rationale (this page doesn't extend base_app.html either, pre-login). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Create Account — ATS Fleet Management</title>

<link rel="manifest" href="{{ url_for('static', filename='app-manifest.json') }}">
<meta name="theme-color" content="#0D1B2A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATS Fleet Management">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='app-icons/icon-180.png') }}">
<link rel="icon" href="{{ url_for('static', filename='app-icons/icon-192.png') }}">

<link rel="stylesheet" href="{{ asset_v('app.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">

<!-- Same "ATS Fleet Management – Login Screen Design Specification" tokens/type/button scale as
     login.html (kept identical on purpose — see that file's head comment) — just a shorter hero
     and tighter field spacing here, since this page carries 5 fields instead of login's 2 and
     still has to fit one locked, non-scrolling screen without scrolling. New accounts created
     here are least-privilege by default (Read Only, non-admin) — see app_signup() in app.py. -->
<style>
  :root {
    --lg-ink: #0D1B2A;
    --lg-label: #374151;
    --lg-steel: #6B7280;
    --lg-placeholder: #9CA3AF;
    --lg-orange: #F97316;
    --lg-orange-deep: #EA580C;
    --lg-paper: #F3F4F6;
    --lg-line: #E5E7EB;
    --lg-white: #FFFFFF;
    /* Fluid spacing unit — see the matching, more detailed comment in login.html. 0 on a short
       phone (where the card has no spare room), growing to 10px by ~844px viewport height and
       staying there beyond that, so gaps open up to a comfortable feel on most phones instead of
       leaving one big dead patch of blank white at the bottom of the card. */
    --lg-extra: clamp(0px, calc((100dvh - 640px) * 0.049), 10px);
  }
  * { box-sizing: border-box; }
  html, body.app-login-body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    /* White, not the ink token — see the matching comment in login.html. Any leftover sliver
       from real mobile browser chrome reads as white card background, not a dark body. */
    background: var(--lg-white);
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--lg-ink);
    -webkit-font-smoothing: antialiased;
  }
  body.app-login-body { display: flex; flex-direction: column; }

  .lg-hero {
    position: relative;
    flex: 0 0 auto;
    height: 30dvh;
    min-height: 186px;
    background-image: url("{{ url_for('static', filename='img/login-hero.jpg') }}");
    background-size: cover;
    background-position: center 58%;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: max(12px, env(safe-area-inset-top)) 20px 0;
  }
  .lg-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,22,41,0.5) 0%, rgba(8,22,41,0.14) 32%, rgba(8,22,41,0) 55%);
  }
  .lg-hero::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 60px;
    background: linear-gradient(180deg, rgba(10,14,22,0) 0%, rgba(10,14,22,0.4) 100%);
  }
  .lg-badge {
    position: relative;
    z-index: 2;
    width: 40px;
    height: 40px;
    border-radius: 13px;
    background: linear-gradient(135deg, var(--lg-orange), var(--lg-orange-deep));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px rgba(249,115,22,0.35);
  }
  .lg-brand {
    position: relative;
    z-index: 2;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    color: #fff;
    text-align: center;
    margin: 7px 0 1px;
    text-shadow: 0 2px 10px rgba(9,26,49,0.5);
  }
  .lg-tagline {
    position: relative;
    z-index: 2;
    font-style: italic;
    font-size: 0.7rem;
    font-weight: 400;
    color: rgba(255,255,255,0.85);
    text-align: center;
    text-shadow: 0 1px 6px rgba(9,26,49,0.45);
  }

  .lg-card {
    position: relative;
    z-index: 2;
    flex: 1 1 0;
    min-height: 0;
    overflow-y: auto;
    margin-top: -18px;
    background: var(--lg-white);
    border-radius: 20px 20px 0 0;
    padding: calc(6px + var(--lg-extra)) 24px max(calc(4px + var(--lg-extra)), env(safe-area-inset-bottom));
    /* No max-width here — see the matching comment in login.html's .lg-card. Keeps this page's
       card and its hero exactly the same width at every viewport, so no body color ever shows
       beside it. */
    width: 100%;
    box-shadow: 0 -14px 30px -18px rgba(11,42,78,0.25);
  }
  .lg-card-title {
    font-family: 'Poppins', sans-serif;
    font-size: 1.2rem;
    font-weight: 600;
    margin: 0;
    color: var(--lg-ink);
  }
  .lg-card-sub {
    margin: 2px 0 calc(4px + var(--lg-extra) * 0.6);
    font-size: 0.78rem;
    color: var(--lg-steel);
    font-weight: 400;
  }
  .lg-error {
    background: #FDECEA;
    color: #C13B2E;
    border: 1px solid #F6C9C2;
    border-radius: 12px;
    padding: 8px 14px;
    font-size: 0.76rem;
    font-weight: 500;
    margin-bottom: 8px;
  }

  .lg-field { margin-bottom: calc(2px + var(--lg-extra)); }
  .lg-field label {
    display: block;
    font-size: 0.74rem;
    font-weight: 500;
    color: var(--lg-label);
    margin-bottom: 4px;
  }
  .lg-input-shell {
    display: flex;
    align-items: center;
    gap: 7px;
    border: 1.5px solid var(--lg-line);
    border-radius: 11px;
    padding: 0 11px;
    background: var(--lg-white);
    transition: border-color 0.15s;
  }
  .lg-input-shell:focus-within { border-color: var(--lg-orange); }
  .lg-input-shell svg { flex-shrink: 0; color: var(--lg-steel); width: 15px; height: 15px; }
  .lg-input-shell input {
    border: none; background: none; outline: none;
    font-family: inherit; font-size: 0.8rem; color: var(--lg-label); font-weight: 400;
    padding: 8px 0; flex: 1; min-width: 0; width: 100%;
  }
  .lg-input-shell input::placeholder { color: var(--lg-placeholder); font-weight: 400; }
  .lg-eye-btn { background: none; border: none; padding: 4px; margin: 0; display: flex; cursor: pointer; color: var(--lg-steel); }
  .lg-eye-btn svg { width: 15px; height: 15px; }

  .lg-btn-primary {
    width: 100%; height: calc(46px + var(--lg-extra) * 0.4); display: flex; align-items: center; justify-content: center; gap: 7px;
    background: linear-gradient(135deg, var(--lg-orange), var(--lg-orange-deep));
    color: #fff; border: none; border-radius: 14px;
    font-family: 'Poppins', sans-serif; font-size: 0.88rem; font-weight: 600;
    cursor: pointer; box-shadow: 0 8px 18px rgba(249,115,22,0.3);
    margin-top: calc(3px + var(--lg-extra) * 0.4);
  }
  .lg-btn-primary svg { width: 15px; height: 15px; flex-shrink: 0; }
  .lg-btn-primary:active { transform: translateY(1px); }

  .lg-signin-row {
    text-align: center; font-size: 0.78rem; font-weight: 400; color: var(--lg-steel);
    margin: calc(6px + var(--lg-extra) * 0.6) 0 0;
  }
  .lg-signin-row a { color: var(--lg-orange); font-weight: 500; text-decoration: none; }

  .lg-trust {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    text-align: center; font-size: 0.68rem; font-weight: 400; color: var(--lg-steel);
    margin: calc(5px + var(--lg-extra) * 0.6) 0 0;
  }
  .lg-trust svg { width: 13px; height: 13px; color: var(--lg-steel); flex-shrink: 0; }
</style>
</head>
<body class="app-login-body">
<!-- No app/_splash.html here either, same reasoning as login.html/base_app.html. -->

<div class="lg-hero">
  <div class="lg-badge">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16v2a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2Z"/><circle cx="7.5" cy="16" r="1.4" fill="#fff" stroke="none"/><circle cx="16.5" cy="16" r="1.4" fill="#fff" stroke="none"/></svg>
  </div>
  <p class="lg-brand">ATS Fleet Management</p>
  <p class="lg-tagline">Drive Business. Move India.</p>
</div>

<div class="lg-card">
  <p class="lg-card-title">Create Account</p>
  <p class="lg-card-sub">Sign up to start managing your fleet</p>
  {% if error %}<div class="lg-error">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="lg-field">
      <label for="full_name">Full Name</label>
      <div class="lg-input-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="full_name" name="full_name" placeholder="Full name" autocomplete="name" required value="{{ form_values.full_name if form_values else '' }}">
      </div>
    </div>
    <div class="lg-field">
      <label for="username">Username</label>
      <div class="lg-input-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l2.5 2.5"/></svg>
        <input type="text" id="username" name="username" placeholder="Choose a username" autocomplete="username" required value="{{ form_values.username if form_values else '' }}">
      </div>
    </div>
    <div class="lg-field">
      <label for="phone">Mobile Number</label>
      <div class="lg-input-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        <input type="tel" id="phone" name="phone" placeholder="Mobile number" autocomplete="tel" value="{{ form_values.phone if form_values else '' }}">
      </div>
    </div>
    <div class="lg-field">
      <label for="password">Password</label>
      <div class="lg-input-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" name="password" placeholder="Min 6 characters" autocomplete="new-password" required minlength="6">
        <button type="button" class="lg-eye-btn" onclick="asTogglePw('password','asEye1')" aria-label="Show password">
          <svg id="asEye1" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="lg-field">
      <label for="confirm_password">Confirm Password</label>
      <div class="lg-input-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter your password" autocomplete="new-password" required minlength="6">
        <button type="button" class="lg-eye-btn" onclick="asTogglePw('confirm_password','asEye2')" aria-label="Show password">
          <svg id="asEye2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="lg-btn-primary">
      Create Account
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <p class="lg-signin-row">Already have an account? <a href="{{ url_for('app_login') }}">Sign In</a></p>

  <p class="lg-trust">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></svg>
    Your data is safe and secure with us
  </p>
</div>

<script>
function asTogglePw(fieldId, iconId) {
  var pw = document.getElementById(fieldId);
  var showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  document.getElementById(iconId).innerHTML = showing
    ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.94 4.24M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
}
</script>
</body>
</html>
