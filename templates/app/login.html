<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign In — {{ company_name }}</title>

<!-- Same install metadata as base_app.html — a user can land here first (session expired, or
     the installed app was just opened logged-out), so this page needs to look and install the
     same way the rest of /app/ does, not fall back to being just "a web page". -->
<link rel="manifest" href="{{ url_for('static', filename='app-manifest.json') }}">
<meta name="theme-color" content="#c05621">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="{{ company_name }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='app-icons/icon-180.png') }}">
<link rel="icon" href="{{ url_for('static', filename='app-icons/icon-192.png') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app-auth.css') }}">
</head>
<body class="app-login-body">
{% include "app/_splash.html" %}
<div class="au-wrap">
  <div class="au-logo-badge">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h11v8H2z"/><path d="M13 11h4l3 3v2h-7z"/><circle cx="6" cy="17.6" r="1.5" fill="#fff" stroke="none"/><circle cx="16.5" cy="17.6" r="1.5" fill="#fff" stroke="none"/><path d="M1 6l2.5-.5M1 9l3-.5"/></svg>
  </div>
  <p class="au-brand">{{ company_name }}</p>
  <p class="au-tagline">Manage your fleet. Drive your business.</p>

  <div class="au-card">
    <p class="au-card-title">Welcome Back!</p>
    <p class="au-card-sub">Login to continue to your account</p>
    {% if error %}<div class="au-error">{{ error }}</div>{% endif %}
    <form method="post">
      <div class="au-field">
        <label for="username">Username</label>
        <div class="au-input-wrap">
          <svg class="au-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
        </div>
      </div>
      <div class="au-field">
        <label for="password">Password</label>
        <div class="au-input-wrap">
          <svg class="au-input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="au-eye-btn" onclick="auTogglePw()" aria-label="Show password">
            <svg id="auEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="au-row">
        <label class="au-remember"><input type="checkbox" name="remember_me" value="1"> Remember me</label>
        <a href="javascript:void(0)" class="au-link" onclick="auForgotPw()">Forgot Password?</a>
      </div>
      <button type="submit" class="au-btn-primary">Sign In</button>
    </form>

    <div class="au-divider"><span>OR</span></div>

    <a href="{{ url_for('app_login_otp') }}" class="au-btn-outline">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      Login with Mobile OTP
    </a>
  </div>

  <p class="au-footer">&copy; {{ year }} {{ company_name }}. All rights reserved.</p>
</div>

<svg class="au-decor" viewBox="0 0 400 90" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <path d="M0 78 H400" stroke="#f0d9c8" stroke-width="2" stroke-dasharray="8 8"/>
  <g fill="#eb6834" opacity="0.9">
    <rect x="18" y="46" width="46" height="26" rx="3"/>
    <path d="M64 54h16l10 10v8H64z"/>
    <circle cx="34" cy="76" r="7" fill="#14213d"/>
    <circle cx="80" cy="76" r="7" fill="#14213d"/>
  </g>
  <path d="M340 50c-7 0-12 5-12 12 0 9 12 20 12 20s12-11 12-20c0-7-5-12-12-12Z" fill="none" stroke="#f0b98c" stroke-width="2"/>
  <circle cx="340" cy="62" r="4" fill="#f0b98c"/>
</svg>

<script>
function auTogglePw() {
  var pw = document.getElementById('password');
  var showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  document.getElementById('auEyeIcon').innerHTML = showing
    ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.94 4.24M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
}
function auForgotPw() {
  alert('Password resets aren\'t self-service in this app — please contact your fleet administrator to reset your password.');
}
</script>
</body>
</html>
