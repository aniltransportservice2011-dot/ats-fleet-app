<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- This page doesn't extend base_app.html (it's the pre-login entry point), so it needs its own
     copy of the same zoom lock — see base_app.html's viewport meta for the full rationale. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sign In — ATS Fleet Management</title>

<!-- Same install metadata as base_app.html — a user can land here first (session expired, or
     the installed app was just opened logged-out), so this page needs to look and install the
     same way the rest of /app/ does, not fall back to being just "a web page". -->
<link rel="manifest" href="{{ url_for('static', filename='app-manifest.json') }}">
<meta name="theme-color" content="#0B2A4E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATS Fleet Management">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='app-icons/icon-180.png') }}">
<link rel="icon" href="{{ url_for('static', filename='app-icons/icon-192.png') }}">

<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">

<!-- Premium sign-in redesign — real background photo (static/img/login-hero.jpg), same real
     form/fields/JS as before (username/password, remember me, Forgot Password, Mobile OTP
     bridge). Brand name is hardcoded "ATS Fleet Management" on THIS page only — an explicit,
     deliberate user request overriding the usual {{ company_name }} (get_company_name()) rule
     this project otherwise follows everywhere else (CLAUDE.md's multi-tenancy-prep discipline).
     If this app is ever used by a second company, this one page's brand text won't reflect
     that — a known, accepted tradeoff of this specific instruction, not an oversight. Every
     other page still uses the real dynamic company_name untouched. -->
<style>
  :root {
    --lg-ink: #0B2A4E;
    --lg-steel: #5C6B84;
    --lg-orange: #E8622C;
    --lg-orange-deep: #C94E1E;
    --lg-paper: #F6F7FA;
    --lg-line: #E4E8EF;
    --lg-white: #FFFFFF;
  }
  * { box-sizing: border-box; }
  /* Locked, non-scrolling frame — hero + card fill exactly one viewport height (100dvh accounts
     for mobile browser chrome collapsing/expanding, same convention as base_app.html elsewhere
     in this app) and never move. If the card's own content is ever taller than the space left
     under a very short/landscape viewport, only the card scrolls internally — the hero and page
     frame itself stay fixed either way. */
  html, body.app-login-body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    background: var(--lg-ink);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--lg-ink);
    -webkit-font-smoothing: antialiased;
  }
  body.app-login-body { display: flex; flex-direction: column; }

  /* Full-bleed photo hero — the real image itself is the background, brand lockup sits directly
     on top of it (transparent, no white panel behind), same as originally built. */
  .lg-hero {
    position: relative;
    flex: 0 0 auto;
    height: 30dvh;
    min-height: 190px;
    background-image: url("{{ url_for('static', filename='img/login-hero.jpg') }}");
    background-size: cover;
    background-position: center 58%;
    background-repeat: no-repeat;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: max(22px, env(safe-area-inset-top)) 24px 0;
  }
  .lg-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,22,41,0.5) 0%, rgba(8,22,41,0.14) 32%, rgba(8,22,41,0) 55%);
  }
  .lg-hero::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 90px;
    background: linear-gradient(180deg, rgba(10,14,22,0) 0%, rgba(10,14,22,0.4) 100%);
  }
  .lg-badge {
    position: relative;
    z-index: 2;
    width: 60px;
    height: 60px;
    border-radius: 18px;
    background: linear-gradient(155deg, #EF7A45, var(--lg-orange-deep));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 22px -6px rgba(201,78,30,0.55), 0 2px 4px rgba(0,0,0,0.15);
  }
  .lg-brand {
    position: relative;
    z-index: 2;
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.01em;
    color: #fff;
    text-align: center;
    margin: 12px 0 2px;
    text-shadow: 0 2px 10px rgba(9,26,49,0.5);
  }
  .lg-sub {
    position: relative;
    z-index: 2;
    font-size: 0.8rem;
    font-weight: 600;
    color: rgba(255,255,255,0.88);
    text-align: center;
    text-shadow: 0 1px 6px rgba(9,26,49,0.45);
  }

  .lg-card {
    position: relative;
    z-index: 2;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    margin-top: -20px;
    background: var(--lg-white);
    border-radius: 26px 26px 0 0;
    padding: 16px 22px max(10px, env(safe-area-inset-bottom));
    width: 100%;
    max-width: 460px;
    margin-left: auto;
    margin-right: auto;
    box-shadow: 0 -14px 30px -18px rgba(11,42,78,0.25);
  }
  .lg-card-title {
    font-family: 'Sora', sans-serif;
    font-size: 1.24rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .lg-card-sub {
    margin: 3px 0 14px;
    font-size: 0.85rem;
    color: var(--lg-steel);
    font-weight: 500;
  }
  .lg-error {
    background: #FDECEA;
    color: #C13B2E;
    border: 1px solid #F6C9C2;
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 0.82rem;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .lg-field { margin-bottom: 11px; }
  .lg-field label {
    display: block;
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--lg-ink);
    margin-bottom: 5px;
  }
  .lg-input-shell {
    display: flex;
    align-items: center;
    gap: 9px;
    border: 1.4px solid var(--lg-line);
    border-radius: 14px;
    padding: 0 14px;
    background: var(--lg-paper);
    transition: border-color 0.15s, background 0.15s;
  }
  .lg-input-shell:focus-within { border-color: var(--lg-orange); background: var(--lg-white); }
  .lg-input-shell svg { flex-shrink: 0; color: var(--lg-steel); width: 18px; height: 18px; }
  .lg-input-shell input {
    border: none; background: none; outline: none;
    font-family: inherit; font-size: 0.92rem; color: var(--lg-ink);
    padding: 10px 0; flex: 1; min-width: 0; width: 100%;
  }
  .lg-input-shell input::placeholder { color: #9AA6B8; font-weight: 500; }
  .lg-eye-btn { background: none; border: none; padding: 4px; margin: 0; display: flex; cursor: pointer; color: var(--lg-steel); }
  .lg-eye-btn svg { width: 18px; height: 18px; }

  .lg-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: -4px 0 14px;
    flex-wrap: wrap;
    gap: 8px;
  }
  .lg-remember { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600; color: var(--lg-steel); }
  .lg-remember input { width: 17px; height: 17px; accent-color: var(--lg-orange); margin: 0; }
  .lg-link { font-size: 0.82rem; font-weight: 700; color: var(--lg-orange-deep); text-decoration: none; background: none; border: none; padding: 0; font-family: inherit; cursor: pointer; }

  .lg-btn-primary {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px;
    background: linear-gradient(135deg, #EF7A45, var(--lg-orange-deep));
    color: #fff; border: none; border-radius: 15px; padding: 12px;
    font-family: 'Sora', sans-serif; font-size: 1rem; font-weight: 700; letter-spacing: 0.01em;
    cursor: pointer; box-shadow: 0 12px 22px -10px rgba(201,78,30,0.65);
  }
  .lg-btn-primary svg { width: 17px; height: 17px; flex-shrink: 0; }
  .lg-btn-primary:active { transform: translateY(1px); }

  .lg-divider {
    display: flex; align-items: center; gap: 12px; margin: 13px 0;
    color: var(--lg-steel); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em;
  }
  .lg-divider::before, .lg-divider::after { content: ''; flex: 1; height: 1px; background: var(--lg-line); }

  .lg-btn-outline {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 9px;
    border: 1.4px solid var(--lg-line); background: var(--lg-white); color: var(--lg-ink);
    border-radius: 15px; padding: 11px; font-family: inherit; font-size: 0.9rem; font-weight: 700;
    text-decoration: none; cursor: pointer;
  }
  .lg-btn-outline svg { width: 18px; height: 18px; color: var(--lg-orange-deep); }

  .lg-footer {
    text-align: center; font-size: 0.68rem; color: var(--lg-steel); opacity: 0.75;
    padding: 10px 20px 2px;
  }
</style>
</head>
<body class="app-login-body">
{% include "app/_splash.html" %}

<div class="lg-hero">
  <div class="lg-badge">
    <!-- Same real truck icon used everywhere else in this app (Total Vehicles KPI, Vehicles nav
         icon, Add Vehicle) — swapped in for the old badge icon here (a smaller, only vaguely
         truck-shaped delivery-van silhouette) so the login badge matches the app's own icon
         language instead of introducing a third, unrelated icon design. -->
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16v2a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2Z"/><circle cx="7.5" cy="16" r="1.4" fill="#fff" stroke="none"/><circle cx="16.5" cy="16" r="1.4" fill="#fff" stroke="none"/></svg>
  </div>
  <p class="lg-brand">ATS Fleet Management</p>
  <!-- Real module names from the app itself (bottom nav + More sheet: Trips, Ledger,
       Maintenance, Vehicles) instead of a redundant "Fleet Management System" line under a
       brand name that already says "Fleet Management" — a small, real orientation instead of
       repeated marketing copy. -->
  <p class="lg-sub">Trips &middot; Ledger &middot; Maintenance &middot; Vehicles</p>
</div>

<div class="lg-card">
  <p class="lg-card-title">Welcome Back!</p>
  <p class="lg-card-sub">Login to continue to your account</p>
  {% if error %}<div class="lg-error">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="lg-field">
      <label for="username">Username</label>
      <div class="lg-input-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
      </div>
    </div>
    <div class="lg-field">
      <label for="password">Password</label>
      <div class="lg-input-shell">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="lg-eye-btn" onclick="auTogglePw()" aria-label="Show password">
          <svg id="auEyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </div>
    <div class="lg-row">
      <label class="lg-remember"><input type="checkbox" name="remember_me" value="1"> Remember me</label>
      <button type="button" class="lg-link" onclick="auForgotPw()">Forgot Password?</button>
    </div>
    <button type="submit" class="lg-btn-primary">
      Sign In
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>

  <div class="lg-divider">OR</div>

  <a href="{{ url_for('app_login_otp') }}" class="lg-btn-outline">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
    Login with Mobile OTP
  </a>

  <p class="lg-footer">&copy; {{ year }} ATS Fleet Management. All rights reserved.</p>
</div>

<script>
function auTogglePw() {
  var pw = document.getElementById('password');
  var showing = pw.type === 'text';
  pw.type = showing ? 'password' : 'text';
  document.getElementById('auEyeIcon').innerHTML = showing
    ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>'
    : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.94 10.94 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.94 4.24M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
}
function auForgotPw() {
  alert('Password resets aren\'t self-service in this app — please contact your fleet administrator to reset your password.');
}
</script>
</body>
</html>
