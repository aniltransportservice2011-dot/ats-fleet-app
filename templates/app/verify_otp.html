<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- This page doesn't extend base_app.html (it's the pre-login entry point), so it needs its own
     copy of the same zoom lock — see base_app.html's viewport meta for the full rationale. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Verify OTP — {{ company_name }}</title>
<link rel="manifest" href="{{ url_for('static', filename='app-manifest.json') }}">
<meta name="theme-color" content="#c05621">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='app-icons/icon-180.png') }}">
<link rel="icon" href="{{ url_for('static', filename='app-icons/icon-192.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='app-auth.css') }}">

<!-- Same photo-hero + white-card frame as login.html/signup.html/login_otp.html — see the
     matching comment in login_otp.html's <style> block for the full rationale. -->
<style>
  :root {
    /* Higher slope/cap than login.html's own unit — this page has much less content (just an
       OTP row + a button + one info box) so needs proportionally more fluid growth to actually
       use up the extra room on a tall phone instead of leaving one big blank patch below the
       info box. */
    --lg-extra: clamp(0px, calc((100dvh - 640px) * 0.08), 24px);
  }
  body.app-login-body {
    display: flex !important; flex-direction: column !important; align-items: stretch !important; justify-content: flex-start !important;
    height: 100vh; height: 100dvh; min-height: 0 !important; overflow: hidden; padding: 0 !important;
    background: var(--a-white);
  }
  .lg-hero {
    position: relative; flex: 0 0 auto; height: 42dvh; min-height: 200px;
    background-image: url("{{ url_for('static', filename='img/login-hero.jpg') }}");
    background-size: cover; background-position: center 58%; background-repeat: no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top)) 24px 0;
  }
  .lg-hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,22,41,0.5) 0%, rgba(8,22,41,0.14) 32%, rgba(8,22,41,0) 55%); }
  .lg-hero::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 90px; background: linear-gradient(180deg, rgba(10,14,22,0) 0%, rgba(10,14,22,0.4) 100%); }
  .lg-badge { position: relative; z-index: 2; width: 44px; height: 44px; border-radius: 14px;
    background: linear-gradient(135deg, var(--a-accent), var(--a-accent-dark)); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 20px rgba(249,115,22,0.35); }
  .lg-brand { position: relative; z-index: 2; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.05rem;
    color: #fff; text-align: center; margin: 9px 0 2px; text-shadow: 0 2px 10px rgba(9,26,49,0.5); }
  .lg-tagline { position: relative; z-index: 2; font-style: italic; font-size: 0.76rem; font-weight: 400;
    color: rgba(255,255,255,0.88); text-align: center; text-shadow: 0 1px 6px rgba(9,26,49,0.45); }

  .lg-card { position: relative; z-index: 2; flex: 1 1 0; min-height: 0; overflow-y: auto;
    margin-top: -20px; background: var(--a-white); border-radius: 20px 20px 0 0;
    padding: calc(6px + var(--lg-extra)) 24px max(calc(6px + var(--lg-extra)), env(safe-area-inset-bottom));
    box-shadow: 0 -14px 30px -18px rgba(11,42,78,0.25); }
  .lg-card .au-subhead { margin-bottom: calc(6px + var(--lg-extra)); }
  .lg-card .au-info-box { margin-top: calc(8px + var(--lg-extra)); }
  .lg-card .au-otp-row { margin: calc(14px + var(--lg-extra)) 0 calc(12px + var(--lg-extra)) !important; }
  .lg-card .au-otp-box { width: calc(46px + var(--lg-extra) * 0.5); height: calc(54px + var(--lg-extra) * 0.5); }
  .lg-card .au-resend { margin-bottom: calc(14px + var(--lg-extra)) !important; }
</style>
</head>
<body class="app-login-body">
{% include "app/_page_loader.html" %}

<div class="lg-hero">
  <div class="lg-badge">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16v2a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2Z"/><circle cx="7.5" cy="16" r="1.4" fill="#fff" stroke="none"/><circle cx="16.5" cy="16" r="1.4" fill="#fff" stroke="none"/></svg>
  </div>
  <p class="lg-brand">ATS Fleet Management</p>
  <p class="lg-tagline">Drive Business. Move India.</p>
</div>

<div class="lg-card">
  <div class="au-subhead">
    <a href="{{ url_for('app_login_otp') }}" class="au-back-btn" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </a>
    <div>
      <div class="au-subhead-title">Verify OTP</div>
      <div class="au-subhead-sub">Enter the 6-digit code sent to<br><strong style="color:var(--a-accent);">+91 {{ phone }}</strong></div>
    </div>
  </div>

  <div class="au-card">
    {% if error %}<div class="au-error">{{ error }}</div>{% endif %}
    <form method="post" action="{{ url_for('app_verify_login_otp') }}" id="otpForm">
      <input type="hidden" name="phone" value="{{ phone }}">
      <input type="hidden" name="otp" id="otpCombined">
      <div class="au-otp-row" id="otpRow">
        {% for i in range(6) %}
        <input type="text" inputmode="numeric" maxlength="1" class="au-otp-box" data-idx="{{ i }}" autocomplete="one-time-code">
        {% endfor %}
      </div>
      <div class="au-resend" id="resendWrap">
        Resend OTP in <span id="resendTimer">00:25</span>
      </div>
      <button type="submit" class="au-btn-primary" id="verifyBtn">Verify &amp; Login</button>
    </form>

    <form method="post" action="{{ url_for('app_login_otp') }}" id="resendForm" style="display:none;">
      <input type="hidden" name="phone" value="{{ phone }}">
    </form>

    <div class="au-info-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="14" height="16" rx="2"/><path d="M6 8h6M6 12h4"/></svg>
      <div>
        <div class="t">Didn't receive the code?</div>
        <div class="d"><button type="button" id="resendBtn" onclick="document.getElementById('resendForm').submit()" disabled style="color:var(--a-steel);">Resend OTP</button></div>
      </div>
    </div>
  </div>
</div>

<script>
var boxes = Array.from(document.querySelectorAll('.au-otp-box'));
boxes[0] && boxes[0].focus();
boxes.forEach(function (box, i) {
  box.addEventListener('input', function () {
    box.value = box.value.replace(/[^0-9]/g, '').slice(0, 1);
    box.classList.toggle('filled', !!box.value);
    if (box.value && i < boxes.length - 1) boxes[i + 1].focus();
  });
  box.addEventListener('keydown', function (e) {
    if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
  });
  box.addEventListener('paste', function (e) {
    var text = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
    if (!text) return;
    e.preventDefault();
    text.split('').slice(0, 6).forEach(function (ch, j) {
      if (boxes[j]) { boxes[j].value = ch; boxes[j].classList.add('filled'); }
    });
    (boxes[Math.min(text.length, 6) - 1] || boxes[5]).focus();
  });
});
document.getElementById('otpForm').addEventListener('submit', function (e) {
  var code = boxes.map(function (b) { return b.value; }).join('');
  document.getElementById('otpCombined').value = code;
  if (code.length !== 6) {
    e.preventDefault();
    alert('Enter the full 6-digit code.');
  }
});

// Real 25s resend cooldown (matches the real 5-minute OTP validity window server-side; this is
// just the "don't spam Send" client-side throttle) — counts down, then enables the real
// Resend button, which posts back to app_login_otp() to actually request a fresh OTP.
var secondsLeft = 25;
var timerEl = document.getElementById('resendTimer');
var resendBtn = document.getElementById('resendBtn');
var resendWrap = document.getElementById('resendWrap');
var iv = setInterval(function () {
  secondsLeft--;
  if (secondsLeft <= 0) {
    clearInterval(iv);
    resendWrap.style.display = 'none';
    resendBtn.disabled = false;
    resendBtn.style.color = 'var(--a-accent)';
    return;
  }
  timerEl.textContent = '00:' + (secondsLeft < 10 ? '0' : '') + secondsLeft;
}, 1000);
</script>
</body>
</html>
