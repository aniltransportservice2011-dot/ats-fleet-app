<!-- Shared hero for every pre-login /app/ screen — login.html, login_otp.html, signup.html.
     Extracted from login.html's own original build so all three share one canonical copy instead
     of three independently-drifting ones (same reasoning as _maintenance_tabstrip.html's own
     comment: a page-local inline copy is exactly what goes stale the next time this needs a
     change — one real bug already happened here before this was pulled out: login_otp.html and
     signup.html were still showing the OLD photo-hero design long after login.html itself moved
     to this ring). The skyline + 6-icon ring + looping truck, all driven by the shared
     .lg-hero/.lg-ring*/.lg-lockup/.lg-badge/.lg-brand rules in app.css and this partial's own
     script at the bottom — needs each including page's own <style> to still declare the
     --lg-orange/--lg-orange-deep/--lg-white/--lg-ink/--lg-steel/--lg-extra tokens these rules
     read (all three pages already do, for their own card/form styling below the hero). -->
<div class="lg-hero">
  <svg class="lg-hero-skyline" viewBox="0 0 375 70" preserveAspectRatio="none" aria-hidden="true">
    <g fill="#14213D" opacity="0.08">
      <rect x="0" y="28" width="24" height="42"/><rect x="27" y="16" width="18" height="54"/>
      <polygon points="48,70 48,20 64,10 80,20 80,70"/><rect x="84" y="34" width="26" height="36"/>
      <rect x="264" y="20" width="22" height="50"/><polygon points="290,70 290,14 305,4 320,14 320,70"/>
      <rect x="324" y="30" width="24" height="40"/><rect x="352" y="18" width="22" height="52"/>
    </g>
  </svg>

  <!-- Fleet-ops icons around the ring (no "Track" — this app has no live vehicle tracking, so
       that icon would advertise a capability that doesn't exist; Monitor/Manage/Maintenance/
       Compliance/Analytics/Fuel are all real /app/ sections) — angle spacing
       computed in Jinja so adding/removing one never needs the angles re-balanced by hand. -->
  <div class="lg-ring">
    {% set lg_ring_items = [
      ('Monitor', '<path d="M4 20V10M10 20V4M16 20v-7M22 20v-4"/>'),
      ('Manage', '<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
      ('Maintenance', '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>'),
      ('Compliance', '<path d="M12 3l7 3v5c0 4.5-3 8-7 9-4-1-7-4.5-7-9V6l7-3Z"/>'),
      ('Analytics', '<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-4 4"/>'),
      ('Fuel', '<path d="M3 22V6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M3 10h10"/><path d="M13 8h3l4 4v6a1 1 0 0 1-1 1h-2"/><circle cx="7" cy="20" r="1.6"/><circle cx="17" cy="20" r="1.6"/>'),
    ] %}
    {% for label, path in lg_ring_items %}
    <div class="lg-ring-item" id="lgRingItem{{ loop.index0 }}" style="--ring-angle: {{ (loop.index0 * (360 / lg_ring_items|length)) - 90 }}deg;">
      <span class="lg-ring-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="#F97316" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">{{ path|safe }}</svg>
      </span>
      <span class="lg-ring-label">{{ label }}</span>
    </div>
    {% endfor %}
    {% for i in range(lg_ring_items|length) %}
    <div class="lg-ring-waypoint" style="transform: rotate({{ ((i + 0.5) * (360 / lg_ring_items|length)) - 90 }}deg) translate(100px);"></div>
    {% endfor %}

    <!-- The visible track + the truck's own math-only path — see .lg-ring-route's own comment in
         app.css for why these are SVG children of the same coordinate space, not
         separately-positioned HTML. r=100 matches the icons' own translate(100px)
         above exactly, so the drawn line passes straight through every icon's center and the
         truck stays visibly ON it the whole time. -->
    <svg class="lg-ring-route" viewBox="0 0 270 270" aria-hidden="true">
      <circle id="lgRingRoutePath" cx="135" cy="135" r="100" pathLength="1"/>
      <circle class="lg-ring-route-dashed" cx="135" cy="135" r="100"/>

      <!-- Truck — a detailed illustration (proper cab, container with the brand's own text +
           corrugated panel lines, windshield, headlights, grille, 3 wheels), scaled down to ring
           size via the fixed inner scale(0.34) below. This truck stays one constant size since
           it's doing endless laps here, not a single arrival. Anchor's own transform
           (translate/rotate only, no scale) is set every frame by the script below from
           #lgRingRoutePath's own getPointAtLength(). -->
      <g id="lgRingTruck">
        <g transform="scale(0.34)">
          <g transform="translate(-61,-44)">
            <ellipse cx="61" cy="53.5" rx="55" ry="3.2" fill="#14213D" opacity="0.15"/>
            <rect x="2" y="8" width="66" height="33" rx="3" fill="#F97316"/>
            <rect x="2" y="8" width="66" height="7" rx="3" fill="#EA580C"/>
            <g stroke="#EA580C" stroke-width="1" opacity="0.45">
              <line x1="10" y1="17" x2="10" y2="39"/><line x1="18" y1="17" x2="18" y2="39"/>
              <line x1="26" y1="17" x2="26" y2="39"/><line x1="34" y1="17" x2="34" y2="39"/>
              <line x1="42" y1="17" x2="42" y2="39"/><line x1="50" y1="17" x2="50" y2="39"/>
              <line x1="58" y1="17" x2="58" y2="39"/>
            </g>
            <circle cx="15.5" cy="28" r="7.4" fill="#14213D"/>
            <svg x="9.5" y="22" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8h11v8H2z"/><path d="M13 11h4l3 3v2h-7z"/><circle cx="6" cy="17.6" r="1.4" fill="#fff" stroke="none"/><circle cx="16.5" cy="17.6" r="1.4" fill="#fff" stroke="none"/></svg>
            <text x="27" y="32.5" font-family="-apple-system, Arial, sans-serif" font-weight="800" font-size="9.5" letter-spacing="0.2" fill="#fff">{{ app_name }}</text>
            <rect x="70" y="15" width="32" height="26" rx="5" fill="#14213D"/>
            <path d="M96 41 L114 41 L114 31 L105 22 L96 22 Z" fill="#14213D"/>
            <rect x="70" y="21" width="3.2" height="5.4" rx="1.2" fill="#1E293B"/>
            <path d="M73.5 19 L93 19 L101 26 L73.5 26 Z" fill="#BFDBFE"/>
            <path d="M75.5 19.4 L82.5 19.4 L78 25.4 L73.8 25.4 Z" fill="#fff" opacity="0.4"/>
            <rect x="105.5" y="30" width="7.5" height="8.4" rx="1.6" fill="#1E293B"/>
            <g stroke="#64748B" stroke-width="0.8"><line x1="107.2" y1="31" x2="107.2" y2="37.4"/><line x1="109.2" y1="31" x2="109.2" y2="37.4"/><line x1="111.2" y1="31" x2="111.2" y2="37.4"/></g>
            <circle cx="108" cy="26.5" r="2.7" fill="#FDE68A"/><circle cx="114.5" cy="29.5" r="2.3" fill="#FDE68A"/>
            <rect x="110" y="39" width="8.5" height="4" rx="1.3" fill="#1E293B"/>
            <rect x="67.5" y="5.5" width="3" height="11" rx="1.2" fill="#94A3B8"/><rect x="66.7" y="4" width="4.6" height="2.2" rx="1" fill="#64748B"/>
            <rect x="2" y="41" width="116" height="2" fill="#14213D" opacity="0.15"/>
            <g fill="#1E293B"><circle cx="20" cy="45.5" r="8.2"/><circle cx="50" cy="45.5" r="8.2"/><circle cx="99" cy="45.5" r="8.2"/></g>
            <g fill="#94A3B8"><circle cx="20" cy="45.5" r="4.6"/><circle cx="50" cy="45.5" r="4.6"/><circle cx="99" cy="45.5" r="4.6"/></g>
            <g fill="#1E293B" opacity="0.7"><circle cx="20" cy="45.5" r="1.4"/><circle cx="50" cy="45.5" r="1.4"/><circle cx="99" cy="45.5" r="1.4"/></g>
          </g>
        </g>
      </g>
    </svg>

    <div class="lg-lockup">
      <div class="lg-badge">
        <!-- The brand's own wheel-and-speed-lines mark (the app icon) — white fill, not the
             icon's own orange gradient, since it sits on this badge's solid orange background. -->
        <svg viewBox="0 0 24 24" width="32" height="32" fill="none">
          <g stroke="#fff" stroke-width="1.6" stroke-linecap="round">
            <line x1="6" y1="6.5" x2="9.5" y2="6.5"/>
            <line x1="3" y1="9.5" x2="9.5" y2="9.5"/>
            <line x1="1" y1="14" x2="9.5" y2="14"/>
            <line x1="4.5" y1="17.3" x2="9.5" y2="17.3"/>
          </g>
          <path fill-rule="evenodd" clip-rule="evenodd" fill="#fff" d="M16 5a7 7 0 1 0 0 14 7 7 0 0 0 0-14Zm0 1.7a5.3 5.3 0 1 1 0 10.6 5.3 5.3 0 0 1 0-10.6Z"/>
          <g stroke="#fff" stroke-width="1.4" stroke-linecap="round">
            <line x1="16" y1="8.2" x2="16" y2="6.4" transform="rotate(0 16 12)"/>
            <line x1="16" y1="8.2" x2="16" y2="6.4" transform="rotate(60 16 12)"/>
            <line x1="16" y1="8.2" x2="16" y2="6.4" transform="rotate(120 16 12)"/>
            <line x1="16" y1="8.2" x2="16" y2="6.4" transform="rotate(180 16 12)"/>
            <line x1="16" y1="8.2" x2="16" y2="6.4" transform="rotate(240 16 12)"/>
            <line x1="16" y1="8.2" x2="16" y2="6.4" transform="rotate(300 16 12)"/>
          </g>
          <circle cx="16" cy="12" r="1.6" fill="#fff"/>
        </svg>
      </div>
      <p class="lg-brand">{{ app_name }}</p>
    </div>
  </div>
</div>

<script>
// Ring truck: the brand's truck loops the circle drawn through the fleet-ops icons, pausing at
// each one in turn — the icon pops slightly bigger (same white/orange design, no color change),
// then the truck moves on. Runs forever on every page that includes this partial, independent of
// the unrelated cold-open splash's own script in _splash.html.
(function () {
  var routePath = document.getElementById('lgRingRoutePath');
  var truckG = document.getElementById('lgRingTruck');
  if (!routePath || !truckG || !routePath.getTotalLength) return;

  var items = [];
  for (var i = 0; document.getElementById('lgRingItem' + i); i++) items.push(document.getElementById('lgRingItem' + i));
  var N = items.length;
  if (!N) return;

  var totalLen = routePath.getTotalLength();

  // Same getPointAtLength()-driven positioning as the splash's own truck (see _splash.html's
  // script for the full rationale) — except this path is a CLOSED loop (a circle), so "a hair
  // further along" for the tangent-angle sample wraps around modulo totalLen instead of ever
  // needing the splash's look-behind fallback near an open path's end.
  //
  // PHASE offset: a plain SVG <circle>'s own length-0 point sits at its 3-o'clock point (verified
  // directly against a real browser), and length increases CLOCKWISE from there. Icon 0's own CSS
  // placement, though, is rotate(-90deg) translate(...) — i.e. the TOP of the ring, a quarter turn
  // further round. Without correcting for that gap, "the truck's logical fraction i/N" and "icon
  // i's actual on-screen position" silently point at two different spots on the circle — the
  // truck would visibly stop a quarter-lap away from whichever icon actually lit up. Subtracting a
  // quarter-turn here is what makes fraction 0 land exactly on icon 0 (and fraction i/N on icon i)
  // for real.
  var PHASE = -0.25;
  function pointAndAngleAt(frac) {
    var g = (((frac + PHASE) % 1) + 1) % 1;
    var d = g * totalLen;
    var p = routePath.getPointAtLength(d);
    var look = routePath.getPointAtLength((d + 1) % totalLen);
    var angle = Math.atan2(look.y - p.y, look.x - p.x) * 180 / Math.PI;
    return { x: p.x, y: p.y, angle: angle };
  }

  // Icon i sits at fraction i/N around this same circle (see the PHASE comment above for why that
  // now actually lines up with icon i's real CSS position) — fraction 0 = icon 0, fraction i/N =
  // icon i, clockwise. No separate angle-to-fraction mapping needed beyond that one offset.
  function place(frac) {
    var pt = pointAndAngleAt(frac);
    truckG.setAttribute('transform', 'translate(' + pt.x + ',' + pt.y + ') rotate(' + pt.angle + ')');
  }

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  place(0);
  if (reduceMotion) return; // parked at icon 0, opacity:0 via CSS — no loop, nothing to arrive at

  function scheduleFrame(fn) {
    if (document.hidden) { setTimeout(function () { fn(performance.now()); }, 16); }
    else { requestAnimationFrame(fn); }
  }
  function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
  function setArrived(i, on) { if (items[i]) items[i].classList.toggle('lg-ring-arrived', on); }

  var LEG_TRAVEL = 900, ARRIVE_PAUSE = 650;
  var leg = 0, state = 'travel', stateStart = null;

  function frame(ts) {
    if (stateStart === null) stateStart = ts;
    var elapsed = ts - stateStart;
    if (state === 'travel') {
      var t = Math.min(1, elapsed / LEG_TRAVEL);
      var fFrom = leg / N, fTo = (leg + 1) / N;
      place(fFrom + (fTo - fFrom) * easeInOutCubic(t));
      if (t >= 1) {
        // Truck fades out for the pause — the icon itself (pops bigger, pure CSS via
        // .lg-ring-arrived) is what reads as "arrived" while the truck is hidden, so the truck
        // body never sits on top of / crowds the icon it just reached.
        setArrived((leg + 1) % N, true);
        truckG.style.opacity = '0';
        state = 'pause'; stateStart = ts;
      }
    } else if (elapsed >= ARRIVE_PAUSE) {
      setArrived((leg + 1) % N, false);
      leg = (leg + 1) % N;
      truckG.style.opacity = '1';
      state = 'travel'; stateStart = ts;
    }
    scheduleFrame(frame);
  }
  scheduleFrame(frame);
})();
</script>
