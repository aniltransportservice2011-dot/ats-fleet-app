<!-- Shared "Business Overview" top tab strip — the 4 real pages the website's own sidebar groups
     under its "Analysis" nav-label (templates/base.html): Business Performance, Fleet
     Utilization, Performance, Route Analytics. All 4 native now; each page includes this same
     strip (rather than each repeating the markup inline) so the 4 links/icons can never drift
     out of sync with each other. active_ov (set by each app_*() route) marks which one is
     current. Order is Business Perf. first, Route Analytics last, per instruction — was
     originally Route Analytics/Fleet Utilization/Performance/Business Perf. -->
<div class="mo-tabstrip">
  <a class="mo-tab {{ 'active' if active_ov == 'business' }}" href="{{ url_for('app_business_performance') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v10l7.07 7.07A10 10 0 1 1 12 2Z"/><path d="M22 12A10 10 0 0 0 12 2v10z"/></svg>
    <span>Business Perf.</span></a>
  <a class="mo-tab {{ 'active' if active_ov == 'fleet' }}" href="{{ url_for('app_fleet_utilization') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16V11l2-5h12l2 5v5"/><path d="M4 16h16v2a1 1 0 0 1-1 1h-1a1 1 0 0 1-1-1v-1H7v1a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2Z"/><circle cx="7.5" cy="16" r="1.3"/><circle cx="16.5" cy="16" r="1.3"/></svg>
    <span>Fleet Utilization</span></a>
  <a class="mo-tab {{ 'active' if active_ov == 'performance' }}" href="{{ url_for('app_performance') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M18 17V9M13 17V5M8 17v-4"/></svg>
    <span>Performance</span></a>
  <a class="mo-tab {{ 'active' if active_ov == 'route' }}" href="{{ url_for('app_analytics') }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a1 1 0 0 1 1-1h4l2 3h8a1 1 0 0 1 1 1v2"/><path d="M4 19h16"/></svg>
    <span>Route Analytics</span></a>
</div>
