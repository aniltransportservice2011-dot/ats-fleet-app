<title>ATS Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  /* ---- Deliberately single-theme: the sunset/highway art direction is a fixed photographic
     mood (like a poster), not something that sensibly inverts for dark mode — every color below
     is declared explicitly so the page holds on either host ground regardless. ---- */
  :root {
    --ink: #0B2A4E;
    --steel: #5C6B84;
    --orange: #E8622C;
    --orange-deep: #C94E1E;
    --gold: #F5A94D;
    --skydeep: #16375E;
    --paper: #F6F7FA;
    --line: #E4E8EF;
    --white: #FFFFFF;
    --page-bg: #EDEFF3;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--page-bg);
    font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 16px;
  }

  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .stage-label {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--steel);
  }

  /* ---------- Phone frame ---------- */
  .phone {
    width: 390px;
    max-width: 100%;
    height: 844px;
    max-height: 92vh;
    background: var(--white);
    border-radius: 46px;
    box-shadow:
      0 1px 2px rgba(11,42,78,0.06),
      0 24px 60px -12px rgba(11,42,78,0.35),
      0 0 0 10px #17233A,
      0 0 0 11px #2C3B57;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .notch {
    position: absolute;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 26px;
    background: #17233A;
    border-radius: 20px;
    z-index: 30;
  }
  .statusbar {
    position: relative;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 26px 0;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 700;
    font-size: 0.92rem;
    color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .statusbar .icons { display: flex; align-items: center; gap: 6px; }

  /* Soft top-down scrim — guarantees the white brand text stays legible regardless of exactly
     where the crop lands on the sky, without flattening the photo's own color underneath it. */
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(8,22,41,0.5) 0%, rgba(8,22,41,0.14) 32%, rgba(8,22,41,0) 55%);
    z-index: 5;
  }
  /* Matching scrim at the seam so the card's top edge always reads clearly against the road,
     whatever brightness that exact strip of the photo happens to have. */
  .hero::after {
    content: '';
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 120px;
    background: linear-gradient(180deg, rgba(10,14,22,0) 0%, rgba(10,14,22,0.38) 100%);
    z-index: 5;
  }

  .brandmark {
    position: relative;
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-top: 40px;
    text-align: center;
  }
  .brand-icon {
    width: 64px;
    height: 64px;
    border-radius: 20px;
    background: linear-gradient(155deg, #EF7A45, var(--orange-deep));
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 10px 24px -6px rgba(201,78,30,0.55), 0 2px 4px rgba(0,0,0,0.15);
  }
  .brand-name {
    font-family: 'Sora', sans-serif;
    font-weight: 700;
    font-size: 1.46rem;
    letter-spacing: -0.01em;
    color: #fff;
    margin: 12px 0 2px;
    text-shadow: 0 2px 10px rgba(9,26,49,0.45);
  }
  .brand-sub {
    font-size: 0.78rem;
    font-weight: 600;
    color: rgba(255,255,255,0.86);
    text-shadow: 0 1px 6px rgba(9,26,49,0.4);
  }

  /* ---------- Card ---------- */
  .card {
    position: relative;
    z-index: 10;
    margin-top: -26px;
    background: var(--white);
    border-radius: 26px 26px 0 0;
    flex: 1;
    padding: 26px 24px 22px;
    box-shadow: 0 -14px 30px -18px rgba(11,42,78,0.25);
    overflow-y: auto;
  }
  .welcome-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .welcome-row h1 {
    font-family: 'Sora', sans-serif;
    font-size: 1.3rem;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .welcome-row .wave { font-size: 1.15rem; }
  .lede {
    margin: 4px 0 18px;
    font-size: 0.86rem;
    color: var(--steel);
    font-weight: 500;
  }

  /* Tabs */
  .tabs {
    display: flex;
    background: var(--paper);
    border-radius: 13px;
    padding: 4px;
    gap: 4px;
    margin-bottom: 20px;
  }
  .tab {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 8px;
    border: none;
    background: transparent;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.82rem;
    font-weight: 700;
    color: var(--steel);
    cursor: pointer;
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
  }
  .tab svg { width: 15px; height: 15px; flex-shrink: 0; }
  .tab.active {
    background: var(--white);
    color: var(--orange-deep);
    box-shadow: 0 1px 2px rgba(11,42,78,0.06), 0 4px 10px -4px rgba(11,42,78,0.15);
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.76rem;
    font-weight: 700;
    color: var(--ink);
    margin-bottom: 7px;
  }
  .input-shell {
    display: flex;
    align-items: center;
    gap: 9px;
    border: 1.4px solid var(--line);
    border-radius: 14px;
    padding: 0 14px;
    background: var(--paper);
    transition: border-color 0.15s, background 0.15s;
  }
  .input-shell:focus-within {
    border-color: var(--orange);
    background: var(--white);
  }
  .input-shell svg { flex-shrink: 0; color: var(--steel); width: 18px; height: 18px; }
  .input-shell input {
    border: none;
    background: none;
    outline: none;
    font-family: inherit;
    font-size: 0.92rem;
    color: var(--ink);
    padding: 13px 0;
    flex: 1;
    min-width: 0;
  }
  .input-shell input::placeholder { color: #9AA6B8; font-weight: 500; }
  .cc {
    display: flex;
    align-items: center;
    gap: 5px;
    padding-right: 10px;

<script>
  function toggleEye() {
    var input = document.getElementById('password');
    var icon = document.getElementById('eyeIcon');
    var showing = input.type === 'text';
    input.type = showing ? 'password' : 'text';
    icon.innerHTML = showing
      ? '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/>'
      : '<path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.6 21.6 0 0 1 5.06-6.06M9.9 4.24A10.4 10.4 0 0 1 12 4c7 0 11 8 11 8a21.6 21.6 0 0 1-2.61 3.81M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  }
  function switchTab(which) {
    var pwTab = document.getElementById('tabPassword');
    var otpTab = document.getElementById('tabOtp');
    var pwField = document.getElementById('passwordField');
    if (which === 'password') {
      pwTab.classList.add('active'); otpTab.classList.remove('active');
      pwField.style.display = '';
      document.getElementById('mobile').placeholder = 'Enter mobile number';
    } else {
      otpTab.classList.add('active'); pwTab.classList.remove('active');
      pwField.style.display = 'none';
    }
  }
</script>
